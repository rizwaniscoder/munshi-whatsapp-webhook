<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b4f34">
  <meta name="robots" content="noindex, nofollow">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Munshi">
  <title>Munshi</title>
  <link rel="manifest" href="__MANIFEST_HREF__">
  <link rel="icon" href="/recorder/icon-192.png">
  <link rel="apple-touch-icon" href="/recorder/icon-192.png">
  <style>
    :root {
      color-scheme: light;
      --ink: #142018;
      --muted: #3e5148;
      --paper: #f4f7f5;
      --card: #ffffff;
      --green: #0e7a4b;
      --green-dark: #0b4f34;
      --green-soft: #e8f6ee;
      --line: #e3ebe6;
      --danger: #b42318;
      --milne: #b42318;
      --dene: #067647;
      --shadow: 0 1px 2px rgba(16, 32, 24, 0.06), 0 8px 24px rgba(16, 32, 24, 0.05);
      --r: 16px;
      --r-sm: 12px;
      --space: 12px;
    }
    .chat-pane[hidden] { display: none !important; }
    section[hidden] { display: none !important; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0; }
    body {
      min-height: 100dvh;
      font-family: system-ui, "Segoe UI", "Noto Sans", sans-serif;
      background: var(--paper);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.35;
      padding: calc(8px + env(safe-area-inset-top)) 12px calc(92px + env(safe-area-inset-bottom));
    }
    main { max-width: 36rem; margin: 0 auto; }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { touch-action: manipulation; cursor: pointer; }
    :focus-visible { outline: 3px solid #86efac; outline-offset: 2px; }
    .app-head { padding: 4px 2px 8px; }
    .app-head h1 { margin: 0; font-size: 1.25rem; line-height: 1.2; font-weight: 750; }
    .eyebrow { margin: 0; color: var(--green); font-size: 0.72rem; font-weight: 800; letter-spacing: 0.06em; text-transform: uppercase; }
    .hint, .legend { margin: 6px 2px 0; color: var(--muted); font-size: 0.82rem; }
    .status { min-height: 0; margin: 4px 0; font-size: 0.92rem; font-weight: 700; color: var(--green-dark); }
    .status:empty { display: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); border: 0; }
    #reply { margin-top: 8px; background: var(--card); border-radius: var(--r); padding: 12px; white-space: pre-wrap; }
    #reply:empty { display: none; }
    #reply img { display: block; max-width: 100%; margin-top: 8px; border-radius: 8px; }
    .heard { margin: 0 0 8px; font-weight: 750; }
    #edit-box:empty { display: none; }
    #actions { display: none; margin-top: 8px; gap: 8px; }
    #actions[style*="flex"] { display: flex; }
    .row-actions, .choice { display: flex; gap: 8px; flex-wrap: wrap; }
    button.secondary, .big, .line-btn, #actions button, .row-actions button {
      min-height: 48px;
      border-radius: var(--r-sm);
      font-weight: 750;
    }
    button.secondary, .line-btn, .row-actions button, #actions button {
      border: 0;
      background: var(--green-soft);
      color: var(--green-dark);
      padding: 0 14px;
    }
    .big { border: 0; background: var(--green); color: white; width: 100%; }
    .choice .big, .chat-top button { width: auto; }
    .choice > button:not(.pay) { flex: 1; min-height: 40px; border: 0; border-radius: 12px; background: var(--green-soft); color: var(--green-dark); font-weight: 750; font-size: 0.82rem; white-space: nowrap; padding: 0 8px; }
    .row-actions button, .choice button.secondary { flex: 1; }
    #actions button[data-action="confirm_yes"], button.secondary[aria-pressed="true"] { background: var(--green); color: white; }
    .danger { background: var(--danger) !important; color: white !important; }
    form.line, .stack { display: flex; gap: 8px; margin-top: 10px; }
    .stack { flex-direction: column; }
    input[type="text"], input[type="number"], input[type="date"], input[type="file"], select, textarea {
      width: 100%;
      min-height: 48px;
      border-radius: var(--r-sm);
      border: 1.5px solid var(--line);
      padding: 0 12px;
      font-size: 16px;
      background: white;
    }
    textarea { padding: 12px; min-height: 88px; }
    input.num-lg { font-size: 1.7rem; font-weight: 750; min-height: 64px; letter-spacing: -0.02em; }
    .card {
      background: var(--card);
      border-radius: var(--r);
      padding: 14px;
      margin-top: 10px;
      box-shadow: var(--shadow);
    }
    .card h2 { margin: 0 0 8px; font-size: 1.05rem; }
    .muted { color: var(--muted); font-size: 0.82rem; font-weight: 600; }
    .tot { font-size: 1rem; font-weight: 750; margin: 0; padding: 8px 0; border-bottom: 1px solid var(--line); background: transparent; }
    .tot:last-child { border-bottom: 0; }
    .empty { text-align: center; background: white; border-radius: var(--r); padding: 22px 14px; margin-top: 10px; color: var(--muted); }
    .empty strong { display: block; color: var(--ink); margin-bottom: 4px; }
    .cow { display: flex; justify-content: space-between; gap: 8px; padding: 10px 0; border-top: 1px solid var(--line); }
    nav {
      position: fixed; left: 0; right: 0; bottom: 0;
      display: grid; grid-template-columns: repeat(6, minmax(0, 1fr));
      padding: 2px 4px calc(4px + env(safe-area-inset-bottom));
      background: rgba(255,255,255,.96);
      border-top: 1px solid var(--line);
      z-index: 20;
    }
    nav button {
      min-height: 52px; border: 0; border-radius: 10px; background: transparent;
      color: var(--muted); font-size: 0.64rem; font-weight: 750;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; padding: 4px 0;
    }
    nav button svg { width: 22px; height: 22px; }
    nav button[aria-current="page"] { color: var(--green-dark); background: var(--green-soft); }
    .sheet {
      position: fixed; left: 0; right: 0; bottom: 0; top: auto; max-height: 92dvh;
      z-index: 40; background: var(--paper); overflow: auto;
      border-radius: 20px 20px 0 0; padding: 14px 12px calc(16px + env(safe-area-inset-bottom));
      box-shadow: 0 -12px 40px rgba(16, 32, 24, 0.18);
    }
    .sheet::before { content: ""; display: block; width: 36px; height: 4px; border-radius: 999px; background: #c9d5ce; margin: 0 auto 10px; }
    .sheet[hidden] { display: none !important; }
    #scrim { position: fixed; inset: 0; background: rgba(16, 32, 24, 0.45); z-index: 35; }
    #scrim[hidden] { display: none !important; }
    #toast {
      position: fixed; left: 12px; right: 12px; top: calc(8px + env(safe-area-inset-top));
      z-index: 80; background: var(--green-dark); color: white; border-radius: 14px;
      padding: 12px 14px; font-weight: 750; text-align: center;
    }
    #toast.bad { background: var(--danger); }
    #toast[hidden] { display: none !important; }
    .line-btn { width: 100%; text-align: left; margin-top: 6px; }
    #confirm {
      position: fixed; left: 16px; right: 16px; top: 50%; transform: translateY(-50%);
      z-index: 70; background: white; border-radius: 18px; padding: 16px; display: none;
      box-shadow: 0 16px 40px rgba(16, 32, 24, 0.22);
    }
    #confirm p { margin: 0 0 12px; font-size: 1.1rem; font-weight: 750; }
    .chat-pane { display: flex; flex-direction: column; min-height: calc(100dvh - 132px); }
    .chat-top { display: flex; gap: 14px; padding: 0 2px 4px; }
    .chat-top button {
      min-height: 36px; border: 0; background: transparent; color: var(--green-dark);
      font-weight: 750; font-size: 0.92rem; padding: 0; width: auto;
    }
    .thread { flex: 1; overflow: auto; min-height: 120px; padding: 4px 0 8px; }
    .bubble {
      max-width: 86%; margin-top: 8px; padding: 10px 12px; border-radius: 16px;
      font-size: 0.98rem; line-height: 1.4; white-space: pre-wrap;
    }
    .bubble p { margin: 0 0 4px; }
    .bubble time { display: block; margin-top: 4px; font-size: 0.7rem; font-weight: 650; opacity: 0.75; }
    .mine { margin-left: auto; background: var(--green); color: white; border-bottom-right-radius: 5px; }
    .theirs { margin-right: auto; background: white; border-bottom-left-radius: 5px; box-shadow: var(--shadow); }
    .confirm-card { max-width: 92%; }
    .confirm-actions { display: flex; gap: 6px; margin-top: 8px; }
    .confirm-actions button { flex: 1; min-height: 40px; border: 0; border-radius: 10px; font-weight: 800; }
    .confirm-actions .yes { background: var(--green); color: white; }
    .confirm-actions .no { background: #fde8e6; color: var(--milne); }
    .confirm-actions .edit { background: var(--green-soft); color: var(--green-dark); }
    .chips { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 8px; scrollbar-width: none; }
    .chips::-webkit-scrollbar { display: none; }
    .chips button {
      flex: 0 0 auto; width: auto; min-height: 34px; height: 34px; padding: 0 12px;
      border-radius: 999px; border: 0; background: white; color: var(--green-dark);
      font-size: 0.84rem; font-weight: 750; box-shadow: var(--shadow);
    }
    .composer[hidden], .chips[hidden] { display: none !important; }
    .composer {
      position: sticky; bottom: 0; display: flex; gap: 8px; align-items: center;
      background: linear-gradient(transparent, var(--paper) 20%); padding: 6px 0 2px; z-index: 4;
    }
    .composer input { flex: 1; background: white; border-radius: 999px; min-height: 48px; }
    #plus {
      width: 44px; min-width: 44px; height: 44px; border-radius: 999px; border: 0;
      background: white; color: var(--green-dark); font-size: 1.5rem; font-weight: 700;
      box-shadow: var(--shadow); padding: 0;
    }
    #record.mic {
      width: 60px; min-width: 60px; height: 60px; min-height: 60px; margin: 0; padding: 0;
      border: 0; border-radius: 999px; background: var(--green); color: white;
      display: grid; place-items: center; box-shadow: 0 6px 16px rgba(14, 122, 75, 0.35);
    }
    #record.mic svg { width: 26px; height: 26px; }
    #record.mic .icon-stop, #record.mic[data-state="recording"] .icon-mic { display: none; }
    #record.mic[data-state="recording"] { background: var(--danger); box-shadow: 0 0 0 0 rgba(180, 35, 24, 0.45); animation: mic-pulse 1.1s ease-out infinite; }
    #record.mic[data-state="recording"] .icon-stop { display: block; }
    #record:disabled { opacity: 0.65; }
    @keyframes mic-pulse {
      0% { box-shadow: 0 0 0 0 rgba(180, 35, 24, 0.45); }
      100% { box-shadow: 0 0 0 16px rgba(180, 35, 24, 0); }
    }
    .home-sum {
      display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;
      background: white; border-radius: var(--r); padding: 10px; margin: 4px 0 8px; box-shadow: var(--shadow);
    }
    .home-sum div { min-width: 0; }
    .home-sum strong { display: block; font-size: 0.95rem; margin-top: 2px; }
    .home-sum.quad { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .home-sum button { all: unset; display: block; width: 100%; cursor: pointer; }
    .seg {
      display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
      background: #e7eee9; border-radius: 12px; padding: 3px; gap: 2px;
    }
    .seg button {
      min-height: 36px; border: 0; border-radius: 10px; background: transparent;
      color: var(--muted); font-weight: 750; font-size: 0.78rem; padding: 0 2px; width: auto;
    }
    .seg button.on, .seg button[aria-pressed="true"] { background: white; color: var(--green-dark); box-shadow: 0 1px 2px rgba(16,32,24,.12); }
    .sticky-sum { position: sticky; top: 0; z-index: 3; }
    .summary { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; background: transparent; box-shadow: none; padding: 0; margin-top: 8px; }
    .summary > div { background: white; border-radius: 14px; padding: 10px 12px; box-shadow: var(--shadow); }
    .summary .dene, .summary .milne { font-size: 1.15rem; margin: 2px 0 0; }
    .search-row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
    .search { flex: 1; min-width: 0; display: flex; align-items: center; gap: 6px; background: white; border-radius: 999px; padding: 0 12px; min-height: 48px; box-shadow: var(--shadow); overflow: hidden; }
    .search svg { width: 18px; height: 18px; flex: 0 0 auto; color: var(--muted); }
    .search input { border: 0; min-width: 0; min-height: 44px; padding: 0; background: transparent; box-shadow: none; }
    .icon-btn {
      width: 48px; min-width: 48px; height: 48px; border: 0; border-radius: 14px;
      background: white; color: var(--green-dark); display: grid; place-items: center;
      box-shadow: var(--shadow); padding: 0;
    }
    .icon-btn svg { width: 20px; height: 20px; }
    .icon-btn[aria-pressed="true"] { background: var(--green); color: white; }
    .party-list { background: white; border-radius: var(--r); overflow: hidden; margin-top: 8px; box-shadow: var(--shadow); }
    .party-row {
      display: flex; gap: 10px; align-items: center; width: 100%; text-align: left;
      background: white; border: 0; border-radius: 0; padding: 10px 12px; margin: 0;
      min-height: 64px; box-shadow: none; border-bottom: 1px solid var(--line);
    }
    .party-list .party-row:last-child { border-bottom: 0; }
    .party-row > .grow strong, .party-row > .grow > span { display: block; }
    .party-row > .grow strong { font-size: 1rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .party-row > span.avatar {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px; height: 40px; flex: 0 0 40px;
      border-radius: 999px; background: var(--green-soft); color: var(--green-dark);
      font-weight: 800; font-size: 0.85rem; line-height: 1; text-align: center; padding: 0;
    }
    .grow { flex: 1; min-width: 0; }
    .party-row > .party-bal { display: flex; flex-direction: column; align-items: flex-end; flex: 0 0 auto; max-width: 46%; text-align: right; }
    .milne { color: var(--milne); font-weight: 800; }
    .dene { color: var(--dene); font-weight: 800; }
    .zero { color: #4b5563; font-weight: 750; }
    .party-bal .muted { color: inherit; font-size: 0.72rem; }
    .hide-bal .money, .hide-bal .milne, .hide-bal .dene, .hide-bal .zero { visibility: hidden; }
    .float-add { width: 100%; margin-top: 12px; }
    .ledger-head { position: sticky; top: 0; z-index: 2; background: var(--paper); padding-bottom: 8px; }
    .pay-row { display: flex; gap: 8px; margin-top: 8px; }
    .pay { flex: 1; min-height: 52px; border: 0; border-radius: 14px; color: white; font-weight: 800; font-size: 1.05rem; }
    .pay-diye { background: var(--dene); }
    .pay-liye { background: var(--milne); }
    .day-label { margin: 14px 2px 6px; font-size: 0.75rem; font-weight: 800; color: var(--muted); }
    .entry {
      width: 100%; display: flex; justify-content: space-between; gap: 8px; align-items: center;
      text-align: left; background: white; border: 0; border-bottom: 1px solid var(--line);
      min-height: 56px; padding: 8px 12px;
    }
    .entry-list { background: white; border-radius: var(--r); overflow: hidden; box-shadow: var(--shadow); }
    .entry-list .entry:last-child { border-bottom: 0; }
    .entry-main { font-weight: 700; min-width: 0; }
    .entry-main .muted { display: block; margin-top: 2px; }
    .entry-amt { text-align: right; font-size: 0.82rem; }
    .entry-amt strong { display: block; }
    .table-wrap { overflow-x: auto; }
    table.khata { width: 100%; border-collapse: collapse; font-size: 0.82rem; }
    table.khata th, table.khata td { text-align: left; padding: 8px 4px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .baqi-label { display: block; font-size: 0.72rem; }
    .menu-item {
      width: 100%; min-height: 48px; margin-top: 6px; text-align: left; border: 0;
      background: white; border-radius: 12px; font-weight: 750; padding: 0 14px; box-shadow: var(--shadow);
    }
    .tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .tile {
      min-height: 64px; border: 0; border-radius: 14px; background: white; color: var(--ink);
      font-weight: 750; font-size: 0.78rem; padding: 8px 4px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    }
    .tile .mark { width: 28px; height: 28px; border-radius: 999px; background: var(--green-soft); color: var(--green-dark); display: grid; place-items: center; font-size: 0.8rem; font-weight: 800; }
    .tile[aria-pressed="true"] { background: var(--green); color: white; }
    .tile[aria-pressed="true"] .mark { background: rgba(255,255,255,.2); color: white; }
    .chip-pick, .name-list { display: flex; flex-wrap: wrap; gap: 6px; }
    .name-list { flex-direction: column; }
    .pick {
      min-height: 40px; border: 0; border-radius: 999px; background: white; color: var(--ink);
      font-weight: 700; padding: 0 12px; box-shadow: var(--shadow);
    }
    .name-list .pick { width: 100%; text-align: left; border-radius: 12px; min-height: 48px; }
    .pick[aria-pressed="true"] { background: var(--green); color: white; }
    .seg.inline { display: flex; }
    .seg.inline button { flex: 1; }
    .save-bar { position: sticky; bottom: 0; background: var(--paper); padding: 10px 0 2px; z-index: 2; }
    #pane-hisaab .choice { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    #pane-hisaab .choice button { min-height: 44px; border: 0; border-radius: 12px; background: white; font-weight: 750; }
    #pane-hisaab .choice button.on { background: var(--green); color: white; }
    @media (max-width: 380px) {
      body { padding-left: 10px; padding-right: 10px; }
      .seg button { font-size: 0.7rem; }
      nav button { font-size: 0.6rem; min-height: 48px; }
      .home-sum strong { font-size: 0.86rem; }
    }
    @media (prefers-reduced-motion: reduce) {
      #record.mic[data-state="recording"] { animation: none; }
    }
  </style>
</head>
<body>
  <main>
    <header class="app-head">
      <p class="eyebrow">Munshi</p>
      <h1 id="farm"></h1>
    </header>
    <section id="pane-bolein" class="chat-pane">
      <div id="home-sum" class="home-sum" hidden></div>
      <div class="chat-top">
        <button type="button" id="chat-old">Purani chats</button>
        <button type="button" id="chat-new">Naya chat</button>
      </div>
      <div id="thread" class="thread"></div>
      <p id="status" class="status" role="status"></p>
      <div id="reply" hidden></div>
      <div id="actions" hidden></div>
      <div id="edit-box"></div>
      <div class="chips" id="quick-chips">
        <button type="button" data-kind="milk">Doodh likhein</button>
        <button type="button" data-kind="sale">Sale</button>
        <button type="button" data-kind="payment">Wasooli</button>
        <button type="button" data-kind="expense">Kharcha</button>
      </div>
      <form id="text-form" class="composer">
        <button type="button" id="plus" aria-label="Likhein">+</button>
        <input id="text" type="text" name="text" maxlength="2000" autocomplete="off" placeholder="Yahan likhein">
        <button id="record" class="mic" type="button" data-state="idle" aria-label="Record">
          <svg class="icon-mic" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V7a3 3 0 0 0-6 0v4a3 3 0 0 0 3 3Zm5-3a1 1 0 1 0-2 0 3 3 0 0 1-6 0 1 1 0 1 0-2 0 5 5 0 0 0 4 4.9V18H9a1 1 0 1 0 0 2h6a1 1 0 1 0 0-2h-2v-2.1A5 5 0 0 0 17 11Z"/></svg>
          <svg class="icon-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
        </button>
      </form>
    </section>
    <section id="pane-aaj" hidden>
      <p id="aaj-status" class="status" role="status"></p>
      <div id="aaj-body"></div>
    </section>
    <section id="pane-grahak" hidden>
      <p id="grahak-status" class="status" role="status"></p>
      <div id="grahak-body"></div>
    </section>
    <section id="pane-khata" hidden>
      <p id="khata-status" class="status" role="status"></p>
      <div id="khata-body"></div>
    </section>
    <section id="pane-hisaab" hidden>
      <p id="hisaab-status" class="status" role="status"></p>
      <div id="hisaab-body"></div>
    </section>
    <section id="pane-tareekh" hidden>
      <p id="tareekh-status" class="status" role="status"></p>
      <div id="tareekh-body"></div>
    </section>
  </main>
  <div id="scrim" hidden></div>
  <div id="toast" role="status" hidden></div>
  <div id="plus-menu" class="sheet" hidden></div>
  <div id="editor" class="sheet" hidden></div>
  <div id="ledger-view" class="sheet" hidden></div>
  <div id="confirm" role="dialog" aria-modal="true">
    <p>Pakka hatana hai?</p>
    <div class="choice">
      <button type="button" id="confirm-yes" class="danger">Haan, hatayein</button>
      <button type="button" id="confirm-no" class="secondary">Nahi</button>
    </div>
  </div>
  <nav>
    <button type="button" data-tab="bolein"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6.5A2.5 2.5 0 0 1 7.5 4h9A2.5 2.5 0 0 1 19 6.5v7A2.5 2.5 0 0 1 16.5 16H9l-4 3.2V13.5A2.5 2.5 0 0 1 5 11V6.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg><span>Bolein</span></button>

  <script id="boot" type="application/json">__BOOT_JSON__</script>
  <script>
    const boot = JSON.parse(document.getElementById("boot").textContent);
    const token = location.pathname.split("/").filter(Boolean).pop();
    const base = "/r/" + encodeURIComponent(token);
    const farm = document.getElementById("farm");
    const recordBtn = document.getElementById("record");
    const statusEl = document.getElementById("status");
    const replyEl = document.getElementById("reply");
    const actionsEl = document.getElementById("actions");
    const form = document.getElementById("text-form");
    const textInput = document.getElementById("text");
    const confirmBox = document.getElementById("confirm");
    farm.textContent = boot.farm || "Munshi";

    function setMic(state) {
      recordBtn.dataset.state = state;
      recordBtn.setAttribute("aria-label", state === "recording" ? "Rok dein" : "Record");
    }

    let toastTimer = 0;
    function toast(text, bad) {
      const node = document.getElementById("toast");
      if (!node || !text) return;
      node.textContent = text;
      node.classList.toggle("bad", !!bad);
      node.hidden = false;
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => { node.hidden = true; }, 2400);
    }

    function todayValue() {
      try {
        return new Intl.DateTimeFormat("en-CA", { timeZone: "Asia/Karachi", year: "numeric", month: "2-digit", day: "2-digit" }).format(new Date());
      } catch (err) {
        return new Date().toISOString().slice(0, 10);
      }
    }

    function rememberedRate(name) {
      try { return localStorage.getItem("munshi-rate:" + String(name || "").trim().toLowerCase()) || ""; } catch (err) { return ""; }
    }

    function rememberRate(name, rate) {
      if (!name || rate == null || rate === "") return;
      try { localStorage.setItem("munshi-rate:" + String(name).trim().toLowerCase(), String(rate)); } catch (err) {}
    }

    function syncScrim() {
      const scrim = document.getElementById("scrim");
      if (!scrim) return;
      const plus = document.getElementById("plus-menu");
      const editor = document.getElementById("editor");
      const ledger = document.getElementById("ledger-view");
      const sheetOpen = [plus, editor, ledger].some((el) => el && !el.hidden);
      scrim.hidden = !(sheetOpen || confirmBox.style.display === "block");
    }

    let recorder = null;
    let chunks = [];
    let stopTimer = 0;
    let busy = false;
    let pendingDelete = null;
    let lastEntries = [];

    const ACTION_LABELS = { confirm_yes: "Haan", confirm_no: "Nahi", confirm_edit: "Edit" };

    function pickMime() {
      const types = ["audio/ogg;codecs=opus", "audio/webm;codecs=opus", "audio/webm", "audio/mp4"];
      if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return "";
      for (const type of types) {
        if (MediaRecorder.isTypeSupported(type)) return type;
      }
      return "";
    }

    function setBusy(on) {
      busy = on;
      recordBtn.disabled = on && recordBtn.dataset.state !== "recording";
      form.querySelector("button").disabled = on;
      for (const button of actionsEl.querySelectorAll("button")) button.disabled = on;
      const editBox = document.getElementById("edit-box");
      if (editBox) for (const button of editBox.querySelectorAll("button")) button.disabled = on;
    }

    function clearEditBox() {
      const editBox = document.getElementById("edit-box");
      if (editBox) editBox.textContent = "";
    }

    function showEditForm(entries) {
      const box = document.getElementById("edit-box");
      if (!box) return;
      box.textContent = "";
      const formEl = document.createElement("form");
      formEl.className = "card";
      formEl.appendChild(el("h2", "Badlein"));
      const rows = [];
      (entries || []).forEach((entry, index) => {
        const block = el("div", null, "stack");
        const title = entry.type === "milk" ? "Doodh" : entry.type === "sale" ? "Sale" : entry.type === "expense" ? "Kharcha" : "Entry";
        block.appendChild(el("strong", title));
        const fields = { index, type: entry.type };
        if (entry.type === "milk") {
          fields.cow_name = input("text", "Gay");
          fields.cow_name.value = entry.cow_name || "";
          block.appendChild(field("Gay", fields.cow_name));
        }
        if (entry.type === "sale") {
          fields.customer = input("text", "Grahak");
          fields.customer.value = entry.customer || "";
          block.appendChild(field("Grahak", fields.customer));
        }
        if (entry.type === "milk" || entry.type === "sale") {
          fields.litres = input("number", "Litre");
          fields.litres.value = entry.litres == null ? "" : String(entry.litres);
          block.appendChild(field("Litre", fields.litres));
          fields.session = document.createElement("select");
          fields.session.appendChild(new Option("Subah", "am"));
          fields.session.appendChild(new Option("Shaam", "pm"));
          const session = String(entry.session || "").toLowerCase();
          fields.session.value = session === "pm" || session === "shaam" ? "pm" : "am";
          block.appendChild(field("Subah / Shaam", fields.session));
        }
        if (entry.type === "sale") {
          fields.rate_pkr = input("number", "Rate");
          fields.rate_pkr.value = entry.rate_pkr == null || entry.rate_pkr === "" ? "" : String(entry.rate_pkr);
          block.appendChild(field("Rate", fields.rate_pkr));
          fields.pay = document.createElement("select");
          fields.pay.appendChild(new Option("Udhaar", "udhaar"));
          fields.pay.appendChild(new Option("Nagd", "nagd"));
          const cash = Number(entry.cash_received) || 0;
          const balance = Number(entry.balance_added) || 0;
          fields.pay.value = cash > 0 && !(balance > 0) ? "nagd" : "udhaar";
          block.appendChild(field("Nagd / Udhaar", fields.pay));
        }
        if (entry.type === "expense" || entry.type === "payment") {
          fields.amount = input("number", "Raqam");
          fields.amount.value = entry.amount == null ? "" : String(entry.amount);
          block.appendChild(field("Raqam", fields.amount));
        }
        formEl.appendChild(block);
        rows.push(fields);
      });
      const save = el("button", "Mehfooz");
      save.type = "submit";
      save.className = "big";
      const again = el("button", "Dobara record karein");
      again.type = "button";
      again.addEventListener("click", () => {
        if (busy) return;
        startRecording();
      });
      formEl.appendChild(save);
      formEl.appendChild(again);
      formEl.addEventListener("submit", (event) => {
        event.preventDefault();
        if (busy) return;
        const patches = rows.map((fields) => {
          const patch = { index: fields.index, type: fields.type };
          if (fields.cow_name) patch.cow_name = fields.cow_name.value;
          if (fields.customer) patch.customer = fields.customer.value;
          if (fields.litres) patch.litres = fields.litres.value;
          if (fields.rate_pkr) patch.rate_pkr = fields.rate_pkr.value;
          if (fields.session) patch.session = fields.session.value;
          if (fields.pay) patch.pay = fields.pay.value;
          if (fields.amount) patch.amount = fields.amount.value;
          return patch;
        });
        sendTurn({ action: "save_edit", entries: patches }, false);
      });
      box.appendChild(formEl);
    }

    function showReplies(replies) {
      replyEl.textContent = "";
      actionsEl.innerHTML = "";
      actionsEl.style.display = "none";
      clearEditBox();
      const parts = [];
      let actions = [];
      let transcript = "";
      let entries = [];
      let openEdit = false;
      for (const reply of replies || []) {
        if (reply.transcript) transcript = String(reply.transcript);
        if (Array.isArray(reply.entries) && reply.entries.length) entries = reply.entries;
        if (reply.kind === "edit") openEdit = true;
        if (reply.text) parts.push(reply.text);
        if (reply.dataUrl) {
          const img = document.createElement("img");
          img.alt = "Parchi";
          img.src = reply.dataUrl;
          replyEl.appendChild(img);
        }
        if (reply.actions && reply.actions.length) actions = reply.actions;
      }
      lastEntries = entries;
      if (transcript) {
        const heard = document.createElement("p");
        heard.className = "heard";
        heard.textContent = "Maine yeh suna: " + transcript;
        replyEl.appendChild(heard);
      }
      if (parts.length) {
        const body = document.createElement("div");
        body.textContent = parts.join("\n\n");
        replyEl.appendChild(body);
      }
      if (actions.length) {
        actionsEl.style.display = "flex";
        for (const action of actions) {
          const button = document.createElement("button");
          button.type = "button";
          button.dataset.action = action.id;
          button.textContent = ACTION_LABELS[action.id] || action.label || action.id;
          button.addEventListener("click", () => {
            if (busy) return;
            if (action.id === "confirm_edit" && lastEntries.length) {
              showEditForm(lastEntries);
              return;
            }
            sendTurn({ action: action.id });
          });
          actionsEl.appendChild(button);
        }
      }
      if (openEdit) showEditForm(entries);
    }

    async function sendTurn(payload, isAudio) {
      setBusy(true);
      statusEl.textContent = "Likh raha hoon...";
      try {
        const url = isAudio ? base + "/audio?thread=" + encodeURIComponent(activeThread || "") : base + "/turn";
        if (!isAudio && payload && typeof payload === "object") payload.thread = payload.thread || activeThread;
        const res = await fetch(url, isAudio ? {
          method: "POST",
          headers: { "Content-Type": payload.type || "audio/webm" },
          body: payload,
        } : {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || data.ok === false) {
          const message = data.error || "Masla aa gaya. Thori dair baad dubara koshish karein.";
          statusEl.textContent = message;
          toast(message, true);
          return;
        }
        statusEl.textContent = "";
        showReplies(data.replies || []);
        if (data.thread_id) activeThread = data.thread_id;
        await paintThread();
      } catch (err) {
        statusEl.textContent = "Internet nahi chal raha. Dubara koshish karein.";
        toast(statusEl.textContent, true);
      } finally {
        setBusy(false);
        recordBtn.disabled = false;
      }
    }

    async function startRecording() {
      if (!navigator.mediaDevices || !window.MediaRecorder) {
        statusEl.textContent = "Yeh browser record nahi kar sakta. Chrome use karein.";
        return;
      }
      let stream;
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      } catch (err) {
        statusEl.textContent = "Mic ki ijazat chahiye. Browser settings mein allow karein.";
        return;
      }
      const mime = pickMime();
      chunks = [];
      recorder = mime ? new MediaRecorder(stream, { mimeType: mime }) : new MediaRecorder(stream);
      recorder.ondataavailable = (event) => {
        if (event.data && event.data.size) chunks.push(event.data);
      };
      recorder.onstop = async () => {
        clearTimeout(stopTimer);
        stream.getTracks().forEach((track) => track.stop());
        setMic("idle");
        const type = recorder.mimeType || mime || "audio/webm";
        const blob = new Blob(chunks, { type });
        if (!blob.size) {
          statusEl.textContent = "Awaz nahi mili. Dobara record karein.";
          return;
        }
        await sendTurn(blob, true);
      };
      recorder.start();
      setMic("recording");
      statusEl.textContent = "Sun raha hoon...";
      stopTimer = setTimeout(() => {
        if (recorder && recorder.state === "recording") recorder.stop();
      }, 90000);
    }

    recordBtn.addEventListener("click", () => {
      if (heldRecord) { heldRecord = false; return; }
      if (busy || threadReadOnly) return;
      if (recorder && recorder.state === "recording") {
        recorder.stop();
        return;
      }
      startRecording();
    });

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (threadReadOnly) return;
      const text = textInput.value.trim();
      if (!text || busy) return;
      textInput.value = "";
      sendTurn({ text: text, thread: activeThread }, false);
    });

    let activeThread = "";
    let threadReadOnly = false;
    let holdArm = 0;
    let heldRecord = false;
    const PLUS = [
      ["milk", "Doodh"],
      ["sale", "Farokht"],
      ["payment", "Wasooli"],
      ["expense", "Kharcha"],
      ["fodder", "Chara"],
      ["customer_adjust", "Udhaar/Jama"],
      ["animal", "Janwar"]
    ];
    const TABLE_KIND = {
      milk_records: "milk",
      sales: "sale",
      payments: "payment",
      expenses: "expense",
      fodder_purchases: "fodder",
      animal_events: "animal",
      cows: "cow",
      customers: "customer",
      feed_stock: "feed",
      committees: "committee",
      committee_log: "committee_log"
    };

    function openReceipt(msg) {
      const ids = (msg.payload && msg.payload.record_ids) || [];
      const first = ids[0];
      if (!first) return;
      openEditor(TABLE_KIND[first.table] || "expense", { id: first.id, kind: TABLE_KIND[first.table] || "" });
    }

    function bubbleTime(iso) {
      if (!iso) return "";
      const when = new Date(iso);
      if (Number.isNaN(when.getTime())) return "";
      return when.toLocaleTimeString("en-GB", { timeZone: "Asia/Karachi", hour: "2-digit", minute: "2-digit" });
    }

    function appendBubble(msg, thread) {
      const bubble = el("div", null, "bubble " + (msg.role === "farmer" ? "mine" : "theirs"));
      if (msg.payload && msg.payload.kind === "receipt") bubble.classList.add("receipt");
      if (msg.payload && msg.payload.kind === "confirm") bubble.classList.add("confirm-card");
      if (msg.content) bubble.appendChild(el("p", msg.content));
      const payload = msg.payload || {};
      if (payload.kind === "receipt") {
        const open = el("button", "Record kholein");
        open.type = "button";
        open.className = "pick";
        open.addEventListener("click", () => openReceipt(msg));
        bubble.appendChild(open);
      }
      const confirmOpen = payload.kind === "confirm"
        && (payload.actions || []).length
        && payload.state !== "yes"
        && payload.state !== "no"
        && payload.state !== "edit"
        && !threadReadOnly;
      if (confirmOpen) {
        const row = el("div", null, "confirm-actions");
        for (const action of payload.actions || []) {
          const button = el("button", ACTION_LABELS[action.id] || action.label || "Haan");
          button.type = "button";
          button.dataset.action = action.id;
          button.className = action.id === "confirm_yes" ? "yes" : action.id === "confirm_no" ? "no" : "edit";
          button.addEventListener("click", () => {
            if (busy) return;
            if (action.id === "confirm_edit" && (payload.entries || []).length) {
              showEditForm(payload.entries);
              return;
            }
            sendTurn({ action: action.id, message_id: msg.id, thread: activeThread });
          });
          row.appendChild(button);
        }
        bubble.appendChild(row);
      } else if (payload.state === "yes" || payload.state === "no" || payload.state === "edit") {
        bubble.appendChild(el("p", payload.state === "yes" ? "Haan" : payload.state === "no" ? "Nahi" : "Edit", "muted"));
      }
      const stamp = bubbleTime(msg.created_at);
      if (stamp) {
        const time = document.createElement("time");
        time.dateTime = msg.created_at;
        time.textContent = stamp;
        bubble.appendChild(time);
      }
      thread.appendChild(bubble);
    }

    async function paintThread(extra) {
      const thread = document.getElementById("thread");
      if (!thread) return;
      const query = new URLSearchParams();
      if (activeThread) query.set("thread", activeThread);
      if (extra && extra.before) query.set("before", extra.before);
      const data = await api("chat" + (query.toString() ? "?" + query.toString() : ""));
      if (!activeThread) activeThread = data.thread_id || "";
      if (!(extra && extra.before)) thread.textContent = "";
      if (data.has_older) {
        const older = el("button", "Purane messages");
        older.type = "button";
        older.className = "secondary";
        const oldest = (data.messages || [])[0];
        older.addEventListener("click", () => paintThread({ before: oldest && oldest.created_at }));
        thread.prepend(older);
      }
      const box = extra && extra.before ? el("div") : thread;
      for (const msg of data.messages || []) appendBubble(msg, extra && extra.before ? box : thread);
      if (extra && extra.before) thread.prepend(box);
      if (!(data.messages || []).length && !(extra && extra.before)) {
        const hello = el("div", null, "empty");
        hello.appendChild(el("strong", "Salam"));
        hello.appendChild(el("p", "Bolein, likhein, ya neeche se kaam chunein."));
        thread.appendChild(hello);
      }
      if (!(extra && extra.before)) thread.scrollTop = thread.scrollHeight;
      form.hidden = threadReadOnly;
      const chips = document.getElementById("quick-chips");
      if (chips) chips.hidden = threadReadOnly;
      if (!threadReadOnly) paintHome();
    }

    async function paintHome() {
      const slot = document.getElementById("home-sum");
      if (!slot) return;
      try {
        const data = await api("aaj");
        const sale = (data.sales || []).reduce((sum, row) => sum + (Number(row.amount) || 0), 0);
        const wasool = Number(data.wasool) || 0;
        slot.hidden = false;
        slot.textContent = "";
        const bits = [["Doodh", (data.milk_litres || 0) + " L"], ["Sale", money(sale)], ["Wasooli", money(wasool)]];
        for (const bit of bits) {
          const cell = el("button", "");
          cell.type = "button";
          cell.appendChild(el("span", bit[0], "muted"));
          cell.appendChild(el("strong", bit[1]));
          cell.addEventListener("click", () => showTab("aaj"));
          slot.appendChild(cell);
        }
      } catch (err) {
        slot.hidden = true;
      }
    }

    async function showOldChats() {
      const thread = document.getElementById("thread");
      thread.textContent = "";
      const search = input("text", "Tareekh ya naam");
      const list = el("div");
      async function load() {
        list.textContent = "";
        const data = await api("chat?threads=1&q=" + encodeURIComponent(search.value || ""));
        if (!(data.threads || []).length) list.appendChild(el("p", "Koi purani chat nahi.", "muted"));
        for (const row of data.threads || []) {
          const button = el("button", (row.title || row.thread_id) + " · " + String(row.updated_at || "").slice(0, 10));
          button.type = "button";
          button.className = "secondary line-btn";
          button.addEventListener("click", () => {
            activeThread = row.thread_id;
            threadReadOnly = true;
            paintThread().catch((err) => { statusEl.textContent = err.message; });
          });
          list.appendChild(button);
        }
      }
      search.addEventListener("input", () => { load().catch(() => {}); });
      thread.appendChild(field("Dhoondein", search));
      thread.appendChild(list);
      const back = el("button", "Aaj ka chat");
      back.type = "button";
      back.className = "big";
      back.addEventListener("click", () => {
        activeThread = "";
        threadReadOnly = false;
        paintThread().catch((err) => { statusEl.textContent = err.message; });
      });
      thread.appendChild(back);
      load().catch((err) => { statusEl.textContent = err.message; });
    }

    document.getElementById("chat-old").addEventListener("click", () => showOldChats());
    document.getElementById("chat-new").addEventListener("click", async () => {
      const data = await api("chat", { op: "new" });
      activeThread = data.thread_id;
      threadReadOnly = false;
      paintThread().catch((err) => { statusEl.textContent = err.message; });
    });
    document.getElementById("quick-chips").addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button || threadReadOnly) return;
      openEditor(button.dataset.kind);
    });
    document.getElementById("plus").addEventListener("click", () => {
      const menu = document.getElementById("plus-menu");
      menu.hidden = !menu.hidden;
      if (!menu.hidden && !menu.childElementCount) {
        menu.appendChild(el("h2", "Likhein"));
        for (const item of PLUS) {
          const button = el("button", item[1]);
          button.type = "button";
          button.className = "menu-item";
          button.addEventListener("click", () => {
            menu.hidden = true;
            openEditor(item[0]);
          });
          menu.appendChild(button);
        }
      }
    });
    recordBtn.addEventListener("pointerdown", () => {
      if (busy || threadReadOnly) return;
      heldRecord = false;
      holdArm = setTimeout(() => {
        heldRecord = true;
        if (!(recorder && recorder.state === "recording")) startRecording();
      }, 280);
    });
    recordBtn.addEventListener("pointerup", () => {
      clearTimeout(holdArm);
      if (heldRecord && recorder && recorder.state === "recording") recorder.stop();
    });
    recordBtn.addEventListener("pointerleave", () => clearTimeout(holdArm));

    function el(tag, text, className) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text != null) node.textContent = text;
      return node;
    }

    function field(label, node) {
      const wrap = el("label", null, "stack");
      wrap.appendChild(el("span", label, "muted"));
      wrap.appendChild(node);
      return wrap;
    }

    function input(type, placeholder) {
      const node = document.createElement("input");
      node.type = type;
      node.placeholder = placeholder || "";
      node.autocomplete = "off";
      if (type === "number") {
        node.inputMode = "decimal";
        node.min = "0";
        node.step = "0.1";
      }
      if (type === "date") node.value = todayValue();
      return node;
    }

    async function api(path, body) {
      const res = await fetch(base + "/api/" + path, body ? {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
      } : { method: "GET" });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || data.ok === false) {
        const message = data.error || "Masla aa gaya.";
        toast(message, true);
        const err = new Error(message);
        err.status = res.status;
        throw err;
      }
      if (body && !/^chat/.test(path)) {
        const op = body.op;
        toast(op === "delete" ? "Hat gaya." : op === "restore" || op === "unarchive" ? "Wapas aa gaya." : op === "archive" ? "Chhupa diya." : "Mehfooz ho gaya.");
      }
      return data;
    }

    function signedAmount(kind, source) {
      if (source && typeof source === "object" && source.signed_balance != null && source.signed_balance !== "") {
        return Number(source.signed_balance) || 0;
      }
      const raw = Number(source && typeof source === "object" ? source.balance : source) || 0;
      return kind === "supplier" ? -raw : raw;
    }

    function balanceView(signed) {
      const value = Math.round(Number(signed) || 0);
      if (Math.abs(value) < 1) return { tone: "zero", label: "Barabar", text: money(0) };
      if (value > 0) return { tone: "milne", label: "Milne hain", text: money(value) };
      return { tone: "dene", label: "Dene hain", text: money(Math.abs(value)) };
    }

    function askDelete(path, body) {
      pendingDelete = { path, body };
      const restore = body && body.op === "restore";
      const prompt = confirmBox.querySelector("p");
      const yes = document.getElementById("confirm-yes");
      if (prompt) prompt.textContent = restore ? "Wapas layein?" : "Pakka hatana hai?";
      if (yes) {
        yes.textContent = restore ? "Haan, wapas layein" : "Haan, hatayein";
        yes.className = restore ? "big" : "danger";
      }
      confirmBox.style.display = "block";
      syncScrim();
    }

    document.getElementById("confirm-no").addEventListener("click", () => {
      pendingDelete = null;
      confirmBox.style.display = "none";
      syncScrim();
    });
    document.getElementById("confirm-yes").addEventListener("click", async () => {
      const job = pendingDelete;
      pendingDelete = null;
      confirmBox.style.display = "none";
      syncScrim();

      try {

      }
    });

    function money(n) {
      const value = Math.round(Number(n) || 0);
      const sign = value < 0 ? "-" : "";
      const text = String(Math.abs(value)).replace(/\B(?=(\d{3})+(?!\d))/g, ",");
      return "Rs " + sign + text;
    }

    function shownNote(line) {
      const raw = String((line && line.note) || "").trim();
      if (!raw || /^(manual|web|whatsapp|screen)\b/i.test(raw)) return (line && line.label) || "";
      return raw;
    }

    function chipPicker(pairs, value, className) {
      const wrap = document.createElement("div");
      wrap.className = className || "chip-pick";
      let current = value == null ? "" : String(value);
      const buttons = [];
      function paint() {
        for (const button of buttons) button.setAttribute("aria-pressed", button.dataset.value === current ? "true" : "false");
      }
      for (const pair of pairs || []) {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "pick";
        button.dataset.value = String(pair[0]);
        button.textContent = pair[1];
        button.addEventListener("click", () => {
          current = String(pair[0]);
          paint();
          wrap.dispatchEvent(new Event("change"));
        });
        buttons.push(button);
        wrap.appendChild(button);
      }
      Object.defineProperty(wrap, "value", {
        get() { return current; },
        set(next) { current = next == null ? "" : String(next); paint(); }
      });
      paint();
      return wrap;
    }

    function iconButton(label, markup, pressed) {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "icon-btn";
      button.setAttribute("aria-label", label);
      button.innerHTML = markup;
      if (pressed) button.setAttribute("aria-pressed", "true");
      return button;
    }

    function initials(name) {
      const parts = String(name || "").trim().split(/\s+/).filter(Boolean);
      return ((parts[0] || "?").slice(0, 1) + (parts[1] || "").slice(0, 1)).toUpperCase();
    }

    function partyRows(data) {
      if (partyTab === "customer") return data.customers || [];
      if (partyTab === "supplier") return data.suppliers || [];
      if (partyTab === "bank") return data.banks || [];
      return [...(data.customers || []), ...(data.suppliers || []), ...(data.banks || [])];
    }

    function option(select, value, label) {
      select.appendChild(new Option(label, value));
    }

    function selectBox(pairs) {
      const node = document.createElement("select");
      for (const pair of pairs) option(node, pair[0], pair[1]);
      return node;
    }

    function recordTitle(row) {
      if (!row) return "Record";
      if (row.kind === "milk") return (row.cow_name || "Gay") + " " + (row.session === "pm" ? "shaam" : "subah") + " " + row.litres + " L";
      if (row.kind === "sale") return (row.customer || "") + " " + row.litres + " L " + money(row.amount);
      if (row.kind === "customer_adjust") return (row.customer || "") + " " + (row.direction === "credit" ? "credit" : "jama") + " " + money(Math.abs(row.balance_added || row.amount || 0));
      if (row.kind === "payment") return (row.customer || "") + " wasool " + money(row.amount);
      if (row.kind === "expense") return (row.label || row.category || "Kharcha") + " " + money(row.amount);
      if (row.kind === "fodder") return (row.item || "Charra") + " " + (row.supplier || "") + " " + money(row.cost_pkr || row.balance_owed);
      if (row.kind === "supplier_payment") return (row.supplier || "") + " adaigi " + money(row.amount || row.cash_paid);
      if (row.kind === "supplier_adjust") return (row.supplier || "") + " jama " + money(row.amount || row.balance_owed);
      if (row.kind === "cow") return row.name || "Gay";
      if (row.kind === "customer") return (row.name || "") + " baqi " + money(row.balance);
      if (row.kind === "supplier") return (row.name || "") + " baqi " + money(row.balance_owed);
      if (row.kind === "animal") return (row.cow || "") + " " + (row.event_type || "");
      if (row.kind === "feed") return (row.item || "Feed") + " " + row.quantity;
      if (row.kind === "committee" || row.kind === "committee_log") return (row.name || row.committee || "Committee") + (row.amount ? " " + money(row.amount) : "");
      return row.name || row.customer || "Record";
    }

    function put(parent, label, node) {
      parent.appendChild(field(label, node));
      return node;
    }

    function openEditor(kind, record) {
      const root = document.getElementById("editor");
      root.hidden = false;
      root.textContent = "";
      const card = el("form", null, "card editor");
      card.appendChild(el("h2", record && record.id ? "Record badlein" : "Likhein"));

      kindSelect.className = "sr-only";
      kindSelect.value = kind || (record && record.kind) || "milk";
      kindSelect.setAttribute("aria-label", "Kya likhna hai");
      const tiles = el("div", null, "tiles");
      for (const pair of KINDS) {
        const tile = el("button", "");
        tile.type = "button";
        tile.className = "tile";
        tile.dataset.kind = pair[0];
        const mark = el("span", pair[1].slice(0, 1), "mark");
        tile.appendChild(mark);
        tile.appendChild(document.createTextNode(pair[1]));
        tile.addEventListener("click", () => {
          if (kindSelect.value === pair[0]) return;
          kindSelect.value = pair[0];
          kindSelect.dispatchEvent(new Event("change"));
        });
        tiles.appendChild(tile);
      }
      function paintTiles() {
        for (const tile of tiles.querySelectorAll(".tile")) {
          tile.setAttribute("aria-pressed", tile.dataset.kind === kindSelect.value ? "true" : "false");
        }
      }
      card.appendChild(tiles);
      card.appendChild(kindSelect);
      const box = el("div", null, "stack");
      card.appendChild(box);
      const status = el("p", "", "status");
      card.appendChild(status);
      const save = el("button", "Mehfooz");
      save.type = "submit";
      save.className = "big";
      const bar = el("div", null, "save-bar");
      bar.appendChild(save);
      if (record && record.id) {
        const del = el("button", "Hatayein");
        del.type = "button";
        del.className = "danger big";
        del.addEventListener("click", () => askDelete("manual", {
          op: "delete",
          kind: kindSelect.value,
          id: record.id,
          name: record.name || record.supplier || "",
          supplier: record.supplier || record.name || ""
        }));
        const hist = el("button", "Is ki tareekh");
        hist.type = "button";
        hist.className = "secondary";
        hist.addEventListener("click", () => {
          root.hidden = true;
          showTab("tareekh");
          renderTareekh({ record: record.id });

        card.appendChild(hist);

      const close = el("button", "Band karein");

      card.appendChild(bar);
      root.appendChild(card);
      const list = el("div", null, "card");
      list.appendChild(el("h2", "Purane records"));
      root.appendChild(list);

      function control(spec, value) {
        if (spec[0] === "select") {
          const preset = value != null && value !== "" ? value : ((spec[2] && spec[2][0] && spec[2][0][0]) || "");
          const mode = spec[1] === "Waqt" || (spec[2] || []).length <= 3 ? "seg inline" : "chip-pick";
          return chipPicker(spec[2], preset, mode);
        }
        if (spec[0] === "names") {
          return chipPicker((spec[2] || []).map((name) => [name, name]), value || "", "name-list");
        }
        const node = input(spec[0] === "date" ? "date" : spec[0] === "number" ? "number" : "text", spec[2] || "");
        if (spec[0] === "number") node.classList.add("num-lg");
        if (value != null && value !== "") node.value = value;
        return node;
      }

      async function draw() {
        const chosen = kindSelect.value;
        box.textContent = "";
        list.textContent = "";
        list.appendChild(el("h2", "Purane records"));
        let data = { records: [], customers: [], cows: [], suppliers: [], committees: [] };
        try {
          data = await api("manual?kind=" + encodeURIComponent(chosen));
        } catch (err) {
          status.textContent = err.message;
        }
        const customers = (data.customers || []).map((row) => row.name);
        const suppliers = (data.suppliers || []).map((row) => row.name);
        const rateFor = (name) => {
          const found = (data.customers || []).find((row) => row.name === name);
          return found && found.rate_pkr ? String(found.rate_pkr) : "";
        };
        const specs = {
          milk: [["names", "Gay", data.cows], ["select", "Waqt", [["am", "Subah"], ["pm", "Shaam"]]], ["number", "Litre"], ["date", "Tareekh"]],
          sale: [["names", "Grahak", customers], ["number", "Litre"], ["number", "Rate"], ["select", "Paise", [["udhaar", "Udhaar"], ["nagd", "Nagd"]]], ["date", "Tareekh"]],
          payment: [["names", "Grahak", customers], ["number", "Raqam"], ["date", "Tareekh"]],
          customer_adjust: [["names", "Grahak", customers], ["select", "Kisam", [["debit", "Jama / udhaar"], ["credit", "Credit"]]], ["number", "Raqam"], ["text", "Yad"], ["date", "Tareekh"]],
          fodder: [["text", "Cheez"], ["names", "Supplier", suppliers], ["number", "Wazan"], ["text", "Unit"], ["number", "Qeemat"], ["number", "Nagd"], ["date", "Tareekh"]],
          supplier_payment: [["names", "Supplier", suppliers], ["number", "Raqam"], ["text", "Yad"], ["date", "Tareekh"]],
          supplier_adjust: [["names", "Supplier", suppliers], ["number", "Raqam"], ["text", "Yad"], ["date", "Tareekh"]],
          expense: [["select", "Kisam", [["labor", "Mazdoori"], ["salary", "Tankhwah"], ["electricity", "Bijli"], ["fuel", "Fuel"], ["medicine", "Dawai"], ["transport", "Kiraya"], ["repairs", "Marammat"], ["kharcha", "Aur kharcha"]]], ["number", "Raqam"], ["text", "Yad"], ["date", "Tareekh"]],
          committee_log: [["names", "Committee", data.committees], ["select", "Halat", [["paid", "Ada diya"], ["not_paid", "Reh gaya"]]], ["number", "Raqam"], ["text", "Yad"], ["date", "Tareekh"]],
          committee: [["text", "Naam"], ["number", "Raqam"], ["select", "Waqt", [["daily", "Roz"], ["weekly", "Hafte"], ["monthly", "Mahine"]]], ["date", "Shuru"]],
          animal: [["names", "Janwar", data.cows], ["select", "Wajah", [["health", "Sehat"], ["vet_visit", "Doctor"], ["breeding", "Nasl"], ["insemination", "Insemination"], ["calving", "Bachcha"]]], ["text", "Tafseel"], ["text", "Doctor"], ["number", "Kharcha"], ["date", "Tareekh"]],
          feed: [["text", "Cheez"], ["number", "Wazan"], ["text", "Unit"], ["number", "Roz kitna"], ["date", "Tareekh"]],
          cow: [["text", "Naam"], ["select", "Qisam", [["cow", "Gay"], ["buffalo", "Bhains"]]], ["text", "Nasl"], ["select", "Halat", [["milking", "Doodh"], ["dry", "Sookha"], ["removed", "Hat gayi"]]], ["number", "Roz litre"]],
          customer: [["text", "Naam"], ["text", "Phone"], ["number", "Rate"], ["number", "Shuruati baqi"], ["select", "Supply", [["", "Baad mein"], ["fixed", "Rozana"], ["flexible", "Flexible"]]], ["number", "Roz litre"], ["select", "Bill", [["daily", "Roz"], ["weekly", "Hafte"], ["monthly", "Mahine"]]]],
          supplier: [["text", "Naam"], ["number", "Shuruati baqi"], ["date", "Tareekh"]]
        };
        if (record && record.id) {
          const found = (data.records || []).find((row) => row.id === record.id);
          if (found) record = found;
        }
        const current = record && (record.kind === chosen || !record.kind) ? record : null;
        const nodes = [];
        for (const spec of specs[chosen] || []) {
          const key = ["Gay", "Waqt", "Litre", "Tareekh", "Grahak", "Rate", "Paise", "Kisam", "Raqam", "Note", "Cheez", "Supplier", "Wazan", "Unit", "Qeemat", "Nagd", "Committee", "Halat", "Naam", "Shuru", "Janwar", "Wajah", "Tafseel", "Doctor", "Kharcha", "Roz kitna", "Qisam", "Nasl", "Roz litre", "Phone", "Shuruati baqi", "Supply", "Bill"][nodes.length];
          const valueMap = {
            milk: [current && current.cow_name, current && current.session, current && current.litres, current && current.date],
            sale: [current && current.customer, current && current.litres, current && current.rate_pkr, current && current.cash_received > 0 ? "nagd" : "udhaar", current && current.date],
            payment: [current && current.customer, current && current.amount, current && current.date],
            customer_adjust: [current && current.customer, current && current.direction, current && Math.abs(current.balance_added || current.amount || 0), current && current.note, current && current.date],
            fodder: [current && current.item, current && current.supplier, current && current.quantity, current && current.unit, current && current.cost_pkr, current && current.cash_paid, current && current.date],
            supplier_payment: [current && current.supplier, current && (current.amount || current.cash_paid), current && current.note, current && current.date],
            supplier_adjust: [current && current.supplier, current && (current.amount || current.balance_owed), current && current.note, current && current.date],
            expense: [current && current.category, current && current.amount, current && current.note, current && current.date],
            committee_log: [current && current.committee, current && current.status, current && current.amount, current && current.note, current && current.date],
            committee: [current && current.name, current && current.amount, current && current.frequency, current && current.start_date],
            animal: [current && current.cow, current && current.event_type, current && current.details, current && current.doctor_name, current && current.cost_pkr, current && current.date],
            feed: [current && current.item, current && current.quantity, current && current.unit, current && current.daily_use, current && current.date],
            cow: [current && current.name, current && current.animal_type, current && current.breed, current && current.status, current && current.avg_daily_litres],
            customer: [current && current.name, current && current.phone, current && current.rate_pkr, current && current.opening_balance, current && current.supply_type, current && current.daily_litres, current && current.billing_cycle],
            supplier: [current && current.name, current && current.opening_balance, current && current.date]
          };
          const preset = (valueMap[chosen] || [])[nodes.length];
          const node = control(spec, preset);
          if (chosen === "sale" && spec[1] === "Rate" && !(current && current.rate_pkr)) {
            const grahak = nodes[0];
            const fill = () => { if (!node.value) node.value = rateFor(grahak.value) || rememberedRate(grahak.value); };
            if (grahak) {
              grahak.addEventListener("change", fill);
              fill();
            }
          }
          put(box, spec[1], node);
          nodes.push(node);
          void key;
        }
        card.onsubmit = async (event) => {
          event.preventDefault();
          const payload = { op: "save", kind: chosen, id: current && current.id || "" };
          const read = (index) => nodes[index] ? nodes[index].value : "";
          if (chosen === "milk") Object.assign(payload, { cow_name: read(0), session: read(1), litres: Number(read(2)), date: read(3) });
          if (chosen === "sale") Object.assign(payload, { customer: read(0), litres: Number(read(1)), rate_pkr: read(2), pay: read(3), date: read(4) });
          if (chosen === "payment") Object.assign(payload, { customer: read(0), amount: Number(read(1)), date: read(2), method: "wasool" });
          if (chosen === "customer_adjust") Object.assign(payload, { customer: read(0), direction: read(1), amount: Number(read(2)), note: read(3), date: read(4) });
          if (chosen === "fodder") Object.assign(payload, { item: read(0), supplier: read(1), quantity: read(2), unit: read(3), cost_pkr: Number(read(4)), cash_paid: Number(read(5) || 0), date: read(6) });
          if (chosen === "supplier_payment" || chosen === "supplier_adjust") Object.assign(payload, { supplier: read(0), amount: Number(read(1)), note: read(2), date: read(3) });
          if (chosen === "expense") Object.assign(payload, { category: read(0), amount: Number(read(1)), note: read(2), date: read(3) });
          if (chosen === "committee_log") Object.assign(payload, { kind: "committee_log", committee: read(0), name: read(0), status: read(1), amount: Number(read(2)), note: read(3), date: read(4) });
          if (chosen === "committee") Object.assign(payload, { name: read(0), amount: Number(read(1)), frequency: read(2), start_date: read(3) });
          if (chosen === "animal") Object.assign(payload, { cow: read(0), event_type: read(1), details: read(2), doctor_name: read(3), cost_pkr: read(4), date: read(5) });
          if (chosen === "feed") Object.assign(payload, { item: read(0), quantity: Number(read(1)), unit: read(2), daily_use: read(3), date: read(4) });
          if (chosen === "cow") Object.assign(payload, { name: read(0), animal_type: read(1), breed: read(2), status: read(3), avg_daily_litres: read(4) });
          if (chosen === "customer") Object.assign(payload, { name: read(0), phone: read(1), rate_pkr: read(2), opening_balance: read(3), supply_type: read(4), daily_litres: read(5), billing_cycle: read(6) });
          if (chosen === "supplier") Object.assign(payload, { name: read(0), opening_balance: read(1), date: read(2), previous_name: current && current.name || "" });
          try {
            await api("manual", payload);
            if (chosen === "sale") rememberRate(read(0), read(2));
            status.textContent = "Mehfooz ho gaya.";
            draw();
          } catch (err) { status.textContent = err.message; }
        };
        if (!(data.records || []).length) list.appendChild(el("p", "Abhi koi record nahi.", "muted"));
        for (const row of data.records || []) {
          const button = el("button", (row.date ? row.date + " " : "") + recordTitle(row));
          button.type = "button";
          button.className = "secondary line-btn";
          button.addEventListener("click", () => openEditor(row.kind, row));
          list.appendChild(button);
        }
      }
      kindSelect.addEventListener("change", () => { record = null; paintTiles(); draw(); });
      paintTiles();
      draw();
    }

        root.appendChild(card);
        const form = el("form", null, "card");
        form.appendChild(el("h2", "Hisaab badlein"));
        const amount = input("number", "Raqam");
        const note = input("text", "Yad");
        const date = input("date", "");
        form.appendChild(field("Raqam", amount));
        form.appendChild(field("Yad", note));
        form.appendChild(field("Tareekh", date));
        const choice = el("div", null, "choice");
        const debit = el("button", kind === "supplier" ? "Jama" : "Udhaar");
        const credit = el("button", kind === "supplier" ? "Adaigi" : "Credit");
        debit.type = "button";
        credit.type = "button";
        async function postAdjust(direction) {
          const payload = direction === "debit"
            ? (kind === "supplier"
              ? { kind: "supplier_adjust", supplier: name, amount: Number(amount.value), note: note.value, date: date.value }
              : { kind: "customer_adjust", customer: name, direction: "debit", amount: Number(amount.value), note: note.value, date: date.value })
            : (kind === "supplier"
              ? { kind: "supplier_payment", supplier: name, amount: Number(amount.value), note: note.value, date: date.value }
              : { kind: "customer_adjust", customer: name, direction: "credit", amount: Number(amount.value), note: note.value, date: date.value });
          await api("manual", payload);
          openLedger(kind, name);
        }
        debit.addEventListener("click", () => postAdjust("debit").catch((err) => { status.textContent = err.message; }));
        credit.addEventListener("click", () => postAdjust("credit").catch((err) => { status.textContent = err.message; }));
        choice.appendChild(debit);
        choice.appendChild(credit);
        form.appendChild(choice);
        const opening = input("number", "Shuruati baqi");
        const setOpen = el("button", "Shuruati baqi");
        setOpen.type = "button";
        setOpen.className = "secondary";
        setOpen.addEventListener("click", async () => {
          try {
            if (kind === "supplier") {
              await api("manual", { kind: "supplier", name: name, opening_balance: Number(opening.value), date: date.value });
            } else {
              const rows = await api("manual?kind=customer");
              const found = (rows.records || []).find((row) => row.name === name);
              await api("manual", { kind: "customer", id: found && found.id, name: name, opening_balance: Number(opening.value) });
            }
            openLedger(kind, name);
          } catch (err) { status.textContent = err.message; }
        });
        form.appendChild(field("Shuruati baqi", opening));
        form.appendChild(setOpen);
        root.appendChild(form);
        const close = el("button", "Band karein");
        close.type = "button";
        close.className = "secondary";
        close.addEventListener("click", () => { root.hidden = true; showTab(kind === "supplier" ? "khata" : "grahak"); });
        root.appendChild(close);
      } catch (err) {
        status.textContent = err.message;
      }
    }

    async function renderTareekh(filter) {
      const status = document.getElementById("tareekh-status");
      const root = document.getElementById("tareekh-body");
      if (!status || !root) return;
      status.textContent = "La raha hoon...";
      root.textContent = "";
      const query = filter || {};
      try {
        const params = new URLSearchParams();
        if (query.account) params.set("account", query.account);
        if (query.record) params.set("record", query.record);
        if (query.table) params.set("table", query.table);
        const data = await api("tareekh" + (params.toString() ? "?" + params.toString() : ""));
        status.textContent = "";
        const form = el("form", null, "card");
        form.appendChild(el("h2", "Tareekh"));
        const account = input("text", "Grahak ya supplier");
        const record = input("text", "Pehchan");
        account.value = query.account || "";
        record.value = query.record || "";
        form.appendChild(field("Hisab", account));
        form.appendChild(field("Pehchan", record));
        const go = el("button", "Dekhein");
        go.type = "submit";
        go.className = "big";
        form.appendChild(go);
        form.addEventListener("submit", (event) => {
          event.preventDefault();
          renderTareekh({ account: account.value, record: record.value });
        });
        root.appendChild(form);
        if (!(data.events || []).length) {
          const blank = el("div", null, "empty");
          blank.appendChild(el("strong", "Abhi koi tabdeeli nahi"));
          blank.appendChild(el("p", "Jo record badlein ya hatayein, woh yahan aayega."));
          root.appendChild(blank);
        }
        for (const event of data.events || []) {
          const card = el("div", null, "card");
          const values = event.new_values || event.old_values || {};
          const who = values.customer || values.name || values.supplier || values.cow_name || values.cow || values.item || values.category || event.table;
          const actionWord = { create: "Naya", update: "Badla", delete: "Hataya" }[event.action] || event.action;
          const tableWord = {
            feed_stock: "chara stock", fodder_purchases: "chara", expenses: "kharcha",
            milk_records: "doodh", sales: "farokht", payments: "wasooli", customers: "grahak", cows: "janwar",
            committee_log: "committee", committees: "committee", animal_events: "janwar"
          }[event.table] || "";
          const nameWords = { labor: "mazdoori", salary: "tankhwah", electricity: "bijli", fuel: "fuel", medicine: "dawai", transport: "kiraya", repairs: "marammat" };
          const titleName = nameWords[who] || (who && who !== event.table ? who : tableWord || who);
          card.appendChild(el("h2", actionWord + " " + titleName));
          const when = event.at ? new Date(event.at).toLocaleString("en-GB", { timeZone: "Asia/Karachi", day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" }) : "";
          card.appendChild(el("p", when, "muted"));
          if (event.recoverable) {
            const back = el("button", "Wapas layein");
            back.type = "button";
            back.className = "big";
            back.addEventListener("click", () => askDelete("tareekh", { op: "restore", record_id: event.record_id, tab: "tareekh" }));
            card.appendChild(back);
          }
          root.appendChild(card);
        }
      } catch (err) {
        status.textContent = err.message || "Internet nahi chal raha. Dubara koshish karein.";
      }
    }

    const likheinBtn = document.getElementById("open-likhein");
    if (likheinBtn) likheinBtn.addEventListener("click", () => openEditor("milk"));

    const panes = {
      bolein: document.getElementById("pane-bolein"),
      aaj: document.getElementById("pane-aaj"),
      grahak: document.getElementById("pane-grahak"),
      khata: document.getElementById("pane-khata"),
      hisaab: document.getElementById("pane-hisaab"),
      tareekh: document.getElementById("pane-tareekh"),
    };

    function showTab(name) {
      const tab = panes[name] ? name : "bolein";
      for (const key of Object.keys(panes)) panes[key].hidden = key !== tab;
      for (const button of document.querySelectorAll("nav button")) {
        button.setAttribute("aria-current", button.dataset.tab === tab ? "page" : "false");
      }
      if (location.hash !== "#" + tab) history.replaceState(null, "", "#" + tab);
      if (tab === "bolein") paintThread().catch(() => {});
      if (tab === "aaj") renderAaj();
      if (tab === "grahak") renderGrahak();
      if (tab === "khata") renderKhata();
      if (tab === "hisaab") renderHisaab("week");
      if (tab === "tareekh") renderTareekh();
    }

    for (const button of document.querySelectorAll("nav button")) {
      button.addEventListener("click", () => showTab(button.dataset.tab));
    }
    showTab((location.hash || "#bolein").slice(1));
    for (const id of ["plus-menu", "editor", "ledger-view"]) {
      const node = document.getElementById(id);
      if (node) new MutationObserver(syncScrim).observe(node, { attributes: true, attributeFilter: ["hidden"] });
    }
    document.getElementById("scrim").addEventListener("click", () => {
      const plus = document.getElementById("plus-menu");
      const editor = document.getElementById("editor");
      const ledger = document.getElementById("ledger-view");
      if (plus) plus.hidden = true;
      if (editor) editor.hidden = true;
      if (ledger) ledger.hidden = true;
      pendingDelete = null;
      confirmBox.style.display = "none";
      syncScrim();
    });

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("/recorder/sw.js", { scope: "/r/" }).catch(() => {});
    }
  </script>
</body>
</html>
